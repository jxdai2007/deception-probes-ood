[project]
name = "jrp-common"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "scikit-learn", "torch", "transformers", "lm-eval", "concept-erasure"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["jrp_common*"]

[tool.pytest.ini_options]
markers = ["slow: tests that download or run a model (deselect with '-m \"not slow\"')"]
